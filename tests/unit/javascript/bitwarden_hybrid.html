<!doctype html>
<html><body>
<form id="register-first" action="/register">
  <input id="reg-email" name="email" autocomplete="email">
  <input id="reg-new" name="new-password" type="password"
         autocomplete="new-password">
  <input id="reg-confirm" name="confirm-password" type="password"
         autocomplete="new-password">
</form>
<form id="login-second" action="/login">
  <input id="login-user" name="username" autocomplete="username">
  <input id="login-password" name="password" type="password"
         autocomplete="current-password">
</form>
</body></html>
